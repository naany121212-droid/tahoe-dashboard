<script>
(async()=>{const img=document.getElementById('logo');try{await img.decode();const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=w;c.height=h;ctx.drawImage(img,0,0);const frame=ctx.getImageData(0,0,w,h),d=frame.data;let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2],hi=Math.max(r,g,b),lo=Math.min(r,g,b),lum=(r+g+b)/3,sat=hi-lo;if(sat<55&&lum>188){const a=Math.max(0,Math.min(1,(226-lum)/34));d[i+3]=Math.round(d[i+3]*a)}if(d[i+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}ctx.putImageData(frame,0,0);const pad=12;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w,x1+pad);y1=Math.min(h,y1+pad);const out=document.createElement('canvas');out.width=x1-x0;out.height=y1-y0;out.getContext('2d').drawImage(c,x0,y0,out.width,out.height,0,0,out.width,out.height);img.src=out.toDataURL('image/png');await img.decode();img.classList.add('ready')}catch(e){img.classList.add('ready')}})();
